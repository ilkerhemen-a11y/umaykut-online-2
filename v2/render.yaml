services:
  - type: web
    name: umaykut-online-2-v2
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: cd v2 && npm install
    preDeployCommand: cd v2 && npm run migrate
    startCommand: cd v2 && npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: umaykut-online-2-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: umaykut-online-2-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: umaykut_online_2_db
    user: umaykut_online_2_db_user
