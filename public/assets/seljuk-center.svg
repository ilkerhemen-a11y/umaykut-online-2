<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" role="img" aria-labelledby="title desc">
<title id="title">Selçuklu merkez sarayı</title><desc id="desc">Altın kubbeli, turkuaz çinili, hilalli minareleri ve taş revakları olan görkemli Selçuklu merkez yapısı.</desc>
<defs>
 <linearGradient id="stone" x2="0" y2="1"><stop stop-color="#f1e5c9"/><stop offset=".55" stop-color="#c4ad83"/><stop offset="1" stop-color="#79654b"/></linearGradient>
 <linearGradient id="shadow" x2="0" y2="1"><stop stop-color="#26352b"/><stop offset="1" stop-color="#101b16"/></linearGradient>
 <linearGradient id="gold" x2=".2" y2="1"><stop stop-color="#fff0a2"/><stop offset=".35" stop-color="#e8bd4e"/><stop offset="1" stop-color="#96621c"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#3d9b9b"/><stop offset="1" stop-color="#164e59"/></linearGradient>
 <linearGradient id="roof" x2="0" y2="1"><stop stop-color="#e5c56d"/><stop offset="1" stop-color="#8b5c22"/></linearGradient>
 <filter id="blur" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="8"/></filter>
 <pattern id="tile" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M9 1 16 9 9 17 2 9Z" fill="none" stroke="#d8c17b" stroke-width="1.5"/><circle cx="9" cy="9" r="2" fill="#e7d69b"/></pattern>
</defs>
