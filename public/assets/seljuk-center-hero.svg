<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 420" role="img" aria-labelledby="title desc">
<title id="title">Selçuklu merkez sarayı</title>
<desc id="desc">İzometrik taş saray; altın kubbe, turkuaz çini kuşağı, işlemeli revaklar ve hilalli minareler.</desc>
<defs>
 <linearGradient id="stoneFront" x1="0" y1="0" x2=".25" y2="1"><stop stop-color="#f4e7c8"/><stop offset=".52" stop-color="#cdb78c"/><stop offset="1" stop-color="#8a7351"/></linearGradient>
 <linearGradient id="stoneSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b7a17a"/><stop offset="1" stop-color="#64523b"/></linearGradient>
 <linearGradient id="goldDome" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#fff4b5"/><stop offset=".28" stop-color="#e9c65e"/><stop offset=".68" stop-color="#bd842d"/><stop offset="1" stop-color="#76501f"/></linearGradient>
 <linearGradient id="turquoise" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#7bd1c9"/><stop offset=".45" stop-color="#258b91"/><stop offset="1" stop-color="#104451"/></linearGradient>
 <linearGradient id="roofBlue" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#4aaab0"/><stop offset=".5" stop-color="#1c6879"/><stop offset="1" stop-color="#12394d"/></linearGradient>
 <linearGradient id="goldTrim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0a2"/><stop offset="1" stop-color="#9b6826"/></linearGradient>
 <pattern id="tilework" width="22" height="22" patternUnits="userSpaceOnUse">
  <path d="M11 1 21 11 11 21 1 11Z" fill="none" stroke="#f0d99a" stroke-width="1.7"/>
  <path d="M11 5 17 11 11 17 5 11Z" fill="none" stroke="#72c8c2" stroke-width="1.4"/>
  <circle cx="11" cy="11" r="2" fill="#f5e4b6"/>
 </pattern>
 <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="8"/></filter>
 <filter id="edgeShadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#09120d" flood-opacity=".55"/></filter>
</defs>
