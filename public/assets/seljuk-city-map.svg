<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<title id="title">Orman içindeki surlarla çevrili Umaykut şehri</title>
<desc id="desc">Taş surlu, kuleli, merkezinde büyük kubbeli saray bulunan, pazar ve atölyeleri olan izometrik Selçuklu şehri.</desc>
<defs>
