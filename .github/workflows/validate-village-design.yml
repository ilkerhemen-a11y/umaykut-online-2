name: Validate village design
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "public/village3d.js"
      - "public/game.js"
      - "public/village2d.js"
      - "public/style.css"
      - "public/assets/user-buildings-atlas.png"
      - ".github/workflows/validate-village-design.yml"
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check public/game.js
          node --check src/buildings.js
          node --check src/units.js
          node --check src/training.js
          node --check src/army.js
          node --check src/server.js
